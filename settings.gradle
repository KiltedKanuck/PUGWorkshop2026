/* Gradle plugins should resolve to the following internally-hosted location:
 *  http://bed-artifactory.bedford.progress.com/artifactory/oe-gradle-thirdparty
 *
 * We utilize the "openedge-version" plugin to detect info from the Git repo:
 *   /com/progress/openedge-version/com.progress.openedge-version.gradle.plugin/
 *
 * All other plugins are used by Maven within the build.gradle script.
 * This file simply sets the intended version to be used for each.
 */

pluginManagement {
    plugins {
        id "com.jfrog.artifactory" version "${artifactoryPluginVersion}"
        id "com.google.osdetector" version "${osdetectorPluginVersion}"
        id "net.nemerosa.versioning" version "${versioningPluginVersion}"
        id "progress.openedge.abl-base" version "${ablBasePluginVersion}"
        id "com.progress.openedge-version" version "${oeVersionPluginVersion}"
        id "com.bmuschko.docker-remote-api" version "${dockerRemoteApiVersion}"
    }
    repositories {
        maven {
            url = "${artifactoryBaseUrl}/oe-gradle-thirdparty"
            allowInsecureProtocol = true
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'OpenEdgeDevSuite'
