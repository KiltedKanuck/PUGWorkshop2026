task CreateManifest(type: ABLRun){
    dependsOn ResolveOpenEdgeDependencies

    outputs.file(manifestFile)

    procedure = "bitness.p"
    wrkDir    = buildDir.path
    propath   = files(mainResourcePath)
    arguments = [
        debugPCT: dbgProp,
        noErrorOnQuit: true,
        failOnError: false,
        resultProperty: "bitness"
    ]

    doLast {
        manifestFile.write( "Implementation-Vendor  : Progress Software Corporation\n")
        manifestFile.append("Implementation-Version : ${oe_build_version}\n")
        manifestFile.append("Package-Type           : \${packageType}\n") // Escaped to keep the ${} in the file, used for copy(expand) later.
        manifestFile.append("Project-Name           : ${projectName}\n")
        manifestFile.append("Build-Date             : " + OffsetDateTime.now(ZoneOffset.UTC).format("yyyy-MM-dd'T'HH:mm:ss.SSSX") + "\n")
        manifestFile.append("Build-OS               : " + System.getProperty("os.name") + " " + System.getProperty("os.arch") + " " + System.getProperty("os.version") + "\n")
        manifestFile.append("Build-JDK              : " + System.getProperty("java.version") + " " + System.getProperty("java.vendor") + " " + System.getProperty("java.vm.version") + "\n")
        manifestFile.append("Build-Version          : ${versioning.info.full}\n")
        manifestFile.append("DLC-Version            : ${abl.openedgeVersion}\n")
        manifestFile.append("DLC-Bitness            : ${ant.bitness}\n")
    }
}

task createPF(type: Copy) {
    outputs.file("$resourcesDir/main/build.pf")
    outputs.file("$resourcesDir/test/build.pf")
    outputs.file("$resourcesDir/test/run.pf")
    outputs.file("$resourcesDir/compileropts.pf")

    // Ensure task reruns if compiler option property changes.
    inputs.property("ablCompilerOpts", getSafePropValue("ablCompilerOpts"))

    // in case there are any params passed in and also in the PF
    String params = getSafePropValue("ablStartupParams", "# No Startup Params")
    String compilerOptsPath = file("$resourcesDir/compileropts.pf").absolutePath
    def configuredCompilerOpts = ablCompOpts.collect { it.trim() }.findAll { it }
    String compilerParams = configuredCompilerOpts ? "-compileroptionsfile \"${compilerOptsPath}\"" : "# No Compiler Options"

    // this "into"'s are relative to the main "into" below
    from(mainResourcePath) {
        into "main"
        include("*.pf")
        expand(buildDir:       buildDir,
               dlcHome:        "${file(abl.dlcHome).absolutePath}",
               packageType:    packageType,
               projectDir:     projectDir,
               startupParams:  params,
               compilerParams: compilerParams)
    }
    from(testResourcePath) {
        into "test"
        include("*.config")
    }
    from(testResourcePath) {
        into "test"
        include("*.pf")
        expand(buildDir:       buildDir,
               dlcHome:        "${file(abl.dlcHome).absolutePath}",
               packageType:    packageType,
               projectDir:     projectDir,
               startupParams:  params,
               compilerParams: compilerParams)
    }
    into resourcesDir
    dirPermissions {
        unix("rwxrwxr-x")
    }
    filePermissions {
        unix("rwxrwxr-x")
    }

    // The ABL compiler options file cannot share the same format as a startup .pf file,
    // so it must be a separate file. We generate it here to keep createPF as the single
    // task responsible for all compilation parameter files.
    // Workaround for OEDF strictOptions being a no-op (OCTA-45620).
    doLast {
        File compilerOptsFile = file("$resourcesDir/compileropts.pf")
        compilerOptsFile.parentFile.mkdirs()
        def compilerOptionMap = [
            "req-full-names": "require-full-names:error",
            "req-ret-val":    "require-return-values:error",
            "req-fld-qual":   "require-field-qualifiers:error",
            "req-full-kw":    "require-full-keywords:error"
        ]

        // Normalize configured values and map any supported shorthand values.
        def activeOpts = ablCompOpts
            .collect { it.trim() }
            .findAll { it }
            .collect { compilerOptionMap[it] ?: it }

        if (activeOpts) {
            // Compiler options file expects comma-separated options.
            compilerOptsFile.text = activeOpts.join(",\n") + "\n"
            logger.quiet("Compiler options file: ${compilerOptsFile.absolutePath} -> ${activeOpts}")
        } else {
            compilerOptsFile.text = ""
            logger.quiet("No compiler options configured; compiler options file left empty and unused.")
        }
    }
}

