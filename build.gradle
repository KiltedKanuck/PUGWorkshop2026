/**
 * Build-time property normalization and validation helpers.
 *
 * CRITICAL: TeamCity configuration parameters accessed via project.findProperty() MUST be
 * defined with the "system." prefix in TeamCity (e.g., system.build_stage).
 * Plain param() values in TeamCity are NOT visible to Gradle unless prefixed with "system."
 * or passed explicitly as -P flags as Gradle project properties.
 *
 * Property resolution order for project.findProperty():
 *   1. System properties (eg. "system." prefix) - HIGHEST PRIORITY (overrides everything)
 *   2. gradle.properties file
 *   3. Fallback value in code - LOWEST PRIORITY
 *
 */

def getSafePropValue = { String key, Object fallback = "" ->
    (project.findProperty(key) ?: fallback).toString().trim()
}

def requirePropValue = { String key, String value, String context = "" ->
    if (!value) {
        String suffix = context ? " ${context}" : ""
        throw new GradleException("${key} must be set${suffix}")
    }
    value
}

def requireNumericPropValue = { String key, String value, String context = "" ->
    requirePropValue(key, value, context)
    if (!(value ==~ /\d+/)) {
        String suffix = context ? " ${context}" : ""
        throw new GradleException("${key} must be numeric${suffix}: '${value}'")
    }
    value
}

def requireVersionFormat = { String key, String value ->
    if (value.split("\\.").length < 3) {
        throw new GradleException("${key} must have at least 3 version elements, got: '${value}'")
    }
    value
}

// Obtain release stage via openedge-version plugin (as openedge_release_stage) or use a default of "develop"
// This should return either "develop" or "release" to create a folder name of "oe-maven-[develop|release]"
String maven_build_type = getSafePropValue("build_stage", openedge_release_stage ?: "develop")
logger.quiet("Using Build Type: $maven_build_type")

// Obtain OE version via openedge-version plugin (as openedge_version) or use a custom (local) version
String oe_build_version = System.getenv("build_target_oe_version") ?: project.findProperty("build_target_oe_version") ?: openedge_version
logger.quiet("OE Build Version: $oe_build_version")
requireVersionFormat("OE version", oe_build_version)

// Determine the OS environment for env.dlcType
String dlcType = System.getenv("dlcType") ?: project.findProperty("dlcType") ?: null

// For hints on which OS are detected
// @see https://github.com/trustin/os-maven-plugin/blob/master/src/main/java/kr/motd/maven/os/Detector.java
if (dlcType == null) {
    if (osdetector.os == "linux") {
        dlcType = "linuxx86_64"
    } else if (osdetector.os == "windows" && osdetector.arch == "x86_32") {
        dlcType = "nt"
    } else if (osdetector.os == "windows" && osdetector.arch == "x86_64") {
        dlcType = "nt64"
    }
    logger.quiet("Detected dlcType: $dlcType")
}

// We MUST have a dlcType defined as OS-detection is not enough for this determination
if (dlcType == null) {throw new GradleException("dlcType not set")}

// Change to lowercase for further checks, making sure we have a supported type defined
dlcType = dlcType.toLowerCase()
