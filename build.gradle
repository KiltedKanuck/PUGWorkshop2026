// Generic method to create an HTML report from JUnit XML (junit-results.xml from JUnitXmlWriter).
// The JUnitXmlWriter already produces standards-compliant XML with all required attributes
// (timestamp, hostname, package, system-out, system-err), so no transformations are needed.
def generateAblTestReport(File testDir, String projectName, File reportDir, File tempDir, boolean showReport) {
    try {
        def originalXml = file("${testDir}/junit-results.xml")
        if (!originalXml.exists()) {
            logger.warn("No junit-results.xml found in ${testDir}, skipping report generation")
            return
        }

        def tempJunitDir = file("${tempDir}/junit-${projectName}")
        tempJunitDir.mkdirs()
        reportDir.mkdirs()

        // Parse JUnit XML
        def parser = new XmlParser()
        def testsuites = parser.parse(originalXml)
        
        // Split <testsuites> into individual TEST-*.xml files for ant.junitreport
        testsuites.testsuite.each { suite ->
            def classname = suite.attribute('classname') ?: suite.attribute('name')
            if (!classname || classname.toString().trim().isEmpty()) {
                logger.warn("Skipping test suite with missing or empty classname/name attribute")
                return
            }
            
            // Sanitize classname for use in filename (replace invalid Windows path characters)
            def sanitizedName = classname.toString().replaceAll('[<>:"/\\\\|?*]', '_')
            
            // Write individual TEST-ClassName.xml file (no transformations - already compliant)
            def testFile = new File(tempJunitDir, "TEST-${sanitizedName}.xml")
            testFile.withWriter('UTF-8') { writer ->
                writer << '<?xml version="1.0" encoding="UTF-8" ?>\n'
                new XmlNodePrinter(new PrintWriter(writer)).print(suite)
            }
        }

        ant.junitreport(todir: tempJunitDir) {
            fileset(dir: tempJunitDir, includes: "TEST-*.xml")
            report(format: "noframes", todir: reportDir) {
                param(name: "TITLE", expression: "Test Results: ${projectName}")
            }
        }

        // Rename the generated HTML report with project-specific name
        def oldHtml = file("${reportDir}/junit-noframes.html")
        def newHtml = file("${reportDir}/${projectName}-results.html")
        if (oldHtml.exists()) {
            if (newHtml.exists()) { newHtml.delete() }
            oldHtml.renameTo(newHtml)
        }

        logger.quiet("Generated test report: ${newHtml}")

        if (showReport) {
            if (newHtml.exists()) {
                java.awt.Desktop.desktop.browse(newHtml.toURI())
            }
        }
    } catch (Exception e) {
        // Don't fail the build if HTML report generation fails - the XML results are what matter
        logger.error("Failed to generate HTML test report for ${projectName}: ${e.message}")
        logger.error("Test results are still available in: ${testDir}/results.xml")
    }
}

// Create HTML test report from ABLUnit results
task ablTestReport(){
    doFirst {
        // Register Ant's junitreport task using the antJunit library
        ant.taskdef(name: 'junitreport',
                    classname: 'org.apache.tools.ant.taskdefs.optional.junit.XMLResultAggregator',
                    classpath: configurations.antJunit.asPath)
    }

    doLast {
        generateAblTestReport(testsDir, "pug", reportsDir, avmTempDir, dlcType == "nt64" && gradle.taskGraph.hasTask(local))
    }
}

// This task executes the tests against the built Procedure Library.
// We call ABLUnitCore.p manually since we want to build the JSON config ourselves.
task ablTest(type: ABLRun) {
    dependsOn compileTest
    if (useDatabase && ablTestType == "db") {
        dependsOn ConnectLocalDB
    }

    onlyIf { ablTestType == "lang" || ablTestType == "db" }

    // Ensure HTML report is generated after tests complete (even if tests fail).
    finalizedBy ablTestReport

    // Note: Pattern for locating test results is "build/**/tests/results.xml",
    // thus any subdirectories must preceed a /tests/ folder.

    inputs.dir(testsDir)
    outputs.file("$testsDir/results.xml")

    File jsonConfig = file("$testsDir/ablunit.json")

    // Execute first at runtime not during configuration, as the various folders aren't yet created
    doFirst {
        File profTemp = file("$avmTempDir/profiler")
        profTemp.mkdirs()

        File logsDir = file("$testsDir/logs")
        logsDir.mkdirs()

        // Creates the JSON file with test programs to run, skipping anything which is un-runnable via command line
        List<String> suiteInclude = []
        List<String> suiteExclude = ["Mock/**"]

        // Include all compiled test files
        suiteInclude = ["**/*.r"]

        writeTestJsonConfig([ outputLocation : testsDir,
                              xrefLocation   : testsDir,
                              xrefExt        : "xref",
                              testCase       : ablTestCase
                            ],
                            fileTree(testsDir).matching{
                                include(suiteInclude)
                                exclude(suiteExclude)
                            },
                            jsonConfig)
    }

    // Note: Statistics should NEVER be enabled for normal usage; reserved only for OE engineering purposes.
    profiler {
        enabled     = true
        coverage    = true
        statistics  = false
        outputFile  = "$testsDir/TestPerformance.prof"
        description = "ABLUnit test coverage for ${projectName}-${oe_build_version}-${dlcType}_${packageType}"
    }

    arguments = [
        debugPCT: dbgProp,
        noErrorOnQuit: true
    ]
    avmOptions {
        parameterFile = file("$resourcesDir/test/run.pf").absolutePath
    }

    if (useDatabase) {
        dbConnectionReferenceId(appDatabaseName)
    }
    wrkDir     = testsDir
    procedure  = "ABLUnitCore.p"

    propath = files(testsDir,                                   // unit test rcode
                    "$distributionDir/${classPackageName}.apl", // project rcode being tested
                    testSourcePath,                             // for other non-code artifacts needed by the tests
                    testResourcePath,                           // pick up runtime config files like logging.config
                    configurations.test)                        // other dependencies

    doLast {
        if (!file("$testsDir/results.xml").exists()) {
            throw new GradleException("ABLUnit results file $testsDir/results.xml not found")
        }
        File resultsFile = file("$testsDir/results.xml")
        def document = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(resultsFile)
        def results = document.documentElement
        String relPath = file(projectDir).relativePath(resultsFile)
        logger.quiet("$relPath: tests=${results.getAttribute('tests')}; errors=${results.getAttribute('errors')}; failures=${results.getAttribute('failures')}; skipped=${results.getAttribute('skipped')}")

        // Copy profiler output files to distribution directory with standardized names.
        // Map format: ["file-extension": "desired-output-filename"]
        def renameMap = [
            "oemp": "TestMemory.oemp",
            "prof": "TestPerformance.prof"
        ]

        // Iterate over each map entry: ext = file extension to find, newName = target filename
        renameMap.each { ext, newName ->
            // Search test directory for any file matching the extension pattern (e.g., "*.oemp", "*.prof")
            def matchingFile = testsDir.listFiles().find { it.name ==~ /.*\.${ext}$/ }

            if (matchingFile) {
                // Copy the found file to distribution directory and rename it to the standardized name
                copy {
                    from matchingFile
                    into distributionDir
                    rename { _ -> newName }
                }
                println "Copied ${testsDir}/${matchingFile.name} to ${distributionDir}/${newName}"
            } else {
                println "No .${ext} file found in $testsDir"
            }
        }
    }
}

//*****************************************
//**  DISTRIBUTION ARTIFACT VALIDATIONS  **
//*****************************************

// Verifies that the archives generated have the correct manifest, and that the PLs are using the UNDEFINED codepage
// We test for:
// - existence (implicitly) of soure and rcode PL
// - that the PLs are build with the UNDEFINED codepage
// - that the PLs contain a tailored MANIFEST.OE file
// - that the APLs contain a tailored WEB-INF/MANIFEST.MF file
// - that each manifest's Implementation-Version, Package-Type and Project-Name are correct
task checkDist(){
    dependsOn packagePreprocessedSource
    dependsOn packageRCode
    dependsOn packageProtectedCode

    inputs.files packagePreprocessedSource
    inputs.files packageRCode
    inputs.files packageProtectedCode

    // States that task must always be run regardless of whether Gradle wants to or not
    doNotTrackState("Sanity check does not have outputs, always run")

    // Use slashy-strings for Regexes (for simplicity)
    // http://docs.groovy-lang.org/docs/latest/html/documentation/#_slashy_string

    // Expected text for validations.
    String codepageRegex    = /.*Library code page is undefined.*/
    String implVersionRegex = /^Implementation-Version\s*: ${oe_build_version}$/
    String projNameRegex    = /^Project-Name\s*: ${projectName}$/
    // Package-Type regex varies by archive

    doFirst {
        // Get the absolute path of the prolib executable
        String absDLC = file(abl.dlcHome).absolutePath
        String prolibExe = "${absDLC}/bin/prolib$exeExt"
        String propackBat = "${absDLC}/bin/propack$batExt"
        File libExtract = file("$buildDir/extract")

        // Create directories for extraction of APL contents.
        libExtract.mkdirs()

        // Get the manifest from the APL, test for expected strings
        copy {
            from zipTree(packageProtectedCode.archiveFile)
            into libExtract
        }
        if (!file("$libExtract/META-INF/MANIFEST.MF").exists()) {
            throw new GradleException("Protected manifest not found")
        }
        if (grepInFile("$libExtract/META-INF/MANIFEST.MF", implVersionRegex) == false) {
            throw new GradleException("Protected manifest does not contain the expected Implementation-Version")
        }
        if (grepInFile("$libExtract/META-INF/MANIFEST.MF", /^Package-Type\s*: apl$/) == false) {
            throw new GradleException("Protected manifest does not contain the expected Package-Type")
        }
        // Validate OpenEdge-Version has 4 segments
        if (grepInFile("$libExtract/META-INF/MANIFEST.MF", /^OpenEdge-Version\s*:\s*\s*$/) == true) {
            throw new GradleException("Protected manifest OpenEdge-Version is empty or missing")
        }
        if (grepInFile("$libExtract/META-INF/MANIFEST.MF", /^OpenEdge-Version\s*:\s*\d+\.\d+\.\d+\.\d+\s*$/) == false) {
            throw new GradleException("Protected manifest OpenEdge-Version must have 4 numeric segments")
        }
        logger.quiet("Passed protected MANIFEST sanity check")

        // Get the manifest from the PL, test for expected strings
        ant.exec(executable: prolibExe,
                 output: "$libExtract/prolib_rcode.log",
                 dir: libExtract) {
            ant.env(key: "DLC", value: absDLC)
            ant.arg(line: "${packageRCode.plFile} -nowarn -yank MANIFEST.OE")
        }
        if (!file("$libExtract/MANIFEST.OE").exists()) {
            throw new GradleException("R-code manifest not found")
        }
        if (grepInFile("$libExtract/MANIFEST.OE", implVersionRegex) == false) {
            throw new GradleException("R-code manifest does not contain the expected Implementation-Version")
        }
        if (grepInFile("$libExtract/MANIFEST.OE", /^Package-Type\s*: ${packageType}$/) == false) {
            throw new GradleException("R-code manifest does not contain the expected Package-Type")
        }
        if (grepInFile("$libExtract/MANIFEST.OE", projNameRegex) == false) {
            throw new GradleException("R-code manifest does not contain the expected Project-Name")
        }
        // Validate DLC-Version has 4 segments
        if (grepInFile("$libExtract/MANIFEST.OE", /^DLC-Version\s*:\s*\s*$/) == true) {
            throw new GradleException("R-code manifest DLC-Version is empty or missing")
        }
        if (grepInFile("$libExtract/MANIFEST.OE", /^DLC-Version\s*:\s*\d+\.\d+\.\d+\.\d+\s*$/) == false) {
            throw new GradleException("R-code manifest DLC-Version must have 4 numeric segments")
        }
        logger.quiet("Passed r-code MANIFEST sanity check")
        delete "$libExtract/MANIFEST.OE"

        // PREPROCESS ZIP
        copy {
            from zipTree(packagePreprocessedSource.archiveFile)
            include "MANIFEST.OE"
            includeEmptyDirs = false
            into libExtract
        }
        if (!file("$libExtract/MANIFEST.OE").exists()) {
            throw new GradleException("Preprocessed code manifest not found")
        }
        if (grepInFile("$libExtract/MANIFEST.OE", implVersionRegex) == false) {
            throw new GradleException("Preprocessed code manifest does not contain the expected Implementation-Version")
        }
        if (grepInFile("$libExtract/MANIFEST.OE", /^Package-Type\s*: preprocessed-sources$/) == false) {
            throw new GradleException("Preprocessed code manifest does not contain the expected Package-Type")
        }
        if (grepInFile("$libExtract/MANIFEST.OE", projNameRegex) == false) {
            throw new GradleException("Preprocessed code manifest does not contain the expected Project-Name")
        }

        String buildRel = file(projectDir).relativePath(distributionDir)
        logger.quiet("Validation of $buildRel artifacts succeeded")
        delete "$libExtract/MANIFEST.OE"
    }
}

