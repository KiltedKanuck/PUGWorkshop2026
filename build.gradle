    getSafePropValue("pasoe_num_msagent_min",
        "${Math.max(2, Math.round(numMsAgentsMax.toInteger() * 0.75))}" // Derive from Maximum MSAgents (rounded to nearest whole number)
    )
)
String numAgentConns = requireNumericPropValue("pasoe_num_agent_conns", getSafePropValue("pasoe_num_agent_conns", "100"))
// By default, set the number of ABL sessions to be equal to the number of agent connections, unless explicitly specified otherwise.
