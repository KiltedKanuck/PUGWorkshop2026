}

// Cleanliness task to check for mixed tabs and spaces in files
task checkMixedWhitespace {
    // List of directories to scan
    List<String> directoriesToCheck = [ablSourcePath, testSourcePath, mainResourcePath, testResourcePath]
    // List of file types to check
    List<String> fileTypes = [".cls", ".p", ".pf", ".json", ".bat", ".ps1", ".sh", ".pl", ".md", ".config", ".xml", ".properties", ".gradle"]
    // List of files to skip (by name or path pattern)
    List<String> filesToSkip = ["mcp.json","loadschema.p","createdomain.p"]

    doLast {
        // Map to store files and their respective lines with mixed tabs and spaces
        def mixedLines = [:]

        // Iterate over each directory
        directoriesToCheck.each { dirPath ->
            def directory = file(dirPath)
            // Recursively iterate over each file in the directory
            directory.eachFileRecurse { file ->
                // Check if the file should be skipped
                def shouldSkip = filesToSkip.any { skipPattern ->
                    file.name == skipPattern || file.path.contains(skipPattern)
                }

                // Check if the file matches any of the specified file types and should not be skipped
                if (!shouldSkip && fileTypes.any { file.name.endsWith(it) }) {
                    // Iterate over each line in the file
                    file.eachLine { line, lineNumber ->
                        // Check if the line contains both tabs and spaces
                        if (line.contains('\t') && line.contains(' ')) {
                            // Add the line number to the map for the current file
                            if (!mixedLines.containsKey(file)) {
                                mixedLines[file] = []
                            }
                            mixedLines[file] << lineNumber
                        }
                    }
                }
            }
        }

        // If any mixed lines are found, print the details and throw an exception
        if (mixedLines) {
            mixedLines.each { file, lines ->
                println "Found mixed tabs and spaces in ${file.path} on lines: ${lines.join(', ')}"
            }
            throw new GradleException("Mixed tabs and spaces found in files.")
        } else {
            println "No mixed tabs and spaces found."
        }
    }
}

// Extract the zipfiles into our local DLC
task extractOpenEdge(type: Copy) {
    outputs.dir(abl.dlcHome)

    from { configurations.dlc.collect { zipTree(it) } }
    into abl.dlcHome
    dirPermissions {
        unix("rwxrwxr-x")
    }
    filePermissions {
        unix("rwxrwxr-x")
    }

    // Exclude unnecessary items to make extraction run faster
    exclude "ant/**/*"
    exclude "auditing/**/*"
    exclude "bin/*dbutils/**/*"
    exclude "bin/infragistics/**/*"
    exclude "bin/netlibs/**/*"
    exclude "bin/netsetup/**/*"
    exclude "bin/telerik/**/*"
    exclude "gradle/**/*"
    exclude "include/**/*"
    exclude "ishield/**/*"
    exclude "newsport*"
    exclude "odbc/**/*"
    exclude "proedit/**/*"
    exclude "src/prodoc/**"
    exclude "src/samples/**"
    exclude "testcerts/**/*"
    exclude "ubqmanager/**/*"
    exclude "wcadd/**/*"
    exclude "**/*.c"
    exclude "**/*.rtf"

    includeEmptyDirs = false

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    doLast {
        logger.quiet("Extracted OpenEdge Version: ${file("${abl.dlcHome}/version").text.trim()}")
    }
}
// Only unzip if DLC is in the project
extractOpenEdge.onlyIf { (dlcInProject) }

task extractLicense(type: Copy){
    outputs.file("${abl.dlcHome}/progress.cfg")

    from { configurations.OpenEdgeLicense.collect {it} }
    into abl.dlcHome
    rename("alltest-${oe_build_version}-${dlcType}.cfg", "progress.cfg")
    dirPermissions {
        unix("rwxrwxr-x")
    }
    filePermissions {
        unix("rwxrwxr-x")
    }
}
// Only unzip if DLC is in the project
extractLicense.onlyIf { (dlcInProject) }

// Extract the zipfiles into our local DLC
task extractPerl(type: Copy) {
    outputs.dir("${abl.dlcHome}/perl")

    if (['nt', 'nt64'].contains(dlcType)) {
        // Windows will package Perl as a zip file
        from { configurations.perl.collect { zipTree(it) } }
    } else {
        // Linux will package Perl as a tar.gz file
        from { configurations.perl.collect { tarTree(resources.gzip(it)) } }
    }
    into "${abl.dlcHome}/perl"
    dirPermissions {
        unix("rwxrwxr-x")
    }
    filePermissions {
        unix("rwxrwxr-x")
    }

    includeEmptyDirs = false

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
// Only unzip if DLC is in the project
extractPerl.onlyIf { (dlcInProject) }

// Rcode "ADE" dependencies, like adecomm, prodict and dataadmin
task extractAde(type: Copy) {
    mustRunAfter extractOpenEdge

    doNotTrackState("Always copy ADE rcode")

    from { configurations.ade.files }
    into "${abl.dlcHome}/${packageType}"
    rename(/^(adecomm|dataadmin|prodict)-.*\.pl$/, '$1.pl')
}
// Only unzip if DLC is in the project
extractAde.onlyIf { (dlcInProject) }

task extractSources() {
    outputs.dir(ablLibs)

    doNotTrackState("Always extract sources")

    // this is needed to force this task to have outputs
    doFirst {
        // dependencies have a name, which we want to use
        configurations.compile.dependencies.each {
            dep -> libSrcPaths << file("$ablLibs/${dep.name}")
            // now get all of the files for that dependency, and extract
            configurations.compile.resolvedConfiguration.resolvedArtifacts
                .findAll { it.name == dep.name && it.moduleVersion.id.group == dep.group }
                .each { artifact ->
                    ant.copy (toDir : "$ablLibs/${dep.name}" ) {
                        plfileset (src : artifact.file.path,
                                   includes : "**/*")
                    }
                }
        }
    }
}

