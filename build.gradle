task cleanDatabase(type: Delete) {
    // States that task must always be run regardless of whether Gradle wants to or not
    doNotTrackState("Clean operation does not have outputs, always run")

    delete databaseDir
}

// Cleans the "ABL output" of the build script. Keeps the dependencies in build/DLC and build/lib
// Intended for developer use, to allow clean builds without having to extract the DLC and PL dependencies each time
task cleanBuildOutput(type: Delete) {
    // States that task must always be run regardless of whether Gradle wants to or not
    doNotTrackState("Clean operation does not have outputs, always run")

    // Clean common items for the project
    delete manifestFile,
           ablLibs,
           buildSourceDir,
           distributionDir,
           installerDir,
           listingOutDir,
           preprocessOutDir,
           rcodeOutDir,
           resourcesDir,
           testsDir,
           xrefOutDir,
           // clean the contents of the temp dir, but not the folder itself
           fileTree(avmTempDir) {include "**/*"},
           // profiler output from ABL task execution (PCT/OEDF side-effect)
           profilerOutDir,
           // Gradle test/check reports
           reportsDir,
           // any logs and OUT files in the build root too
           fileTree(buildDir) {include "*.log", "*.out" },
           file("$buildDir/tmp")
}

// Recompiles and packages ABL-related code only, skipping the UI build and packaging
task recompile() {
    dependsOn cleanBuildOutput, packageCode, packageSchema, ablTest

    packageCode.mustRunAfter cleanBuildOutput
    packageSchema.mustRunAfter packageCode
    ablTest.mustRunAfter packageCode
}

// Quick recompile focused on building and packaging only (fully skip testing)
task quickpile() {
    dependsOn cleanBuildOutput, packageCode, packageSchema

    packageCode.mustRunAfter cleanBuildOutput
    packageSchema.mustRunAfter packageCode
}

// Further updates the OEAR for the default ABL Application
task tailorContents(type: Copy) {
    dependsOn packageProtectedCode

    inputs.dir(pasoeSourceDir)
    inputs.dir(oearPrimaryWebAppDir)
    inputs.dir(oearMonitorWebAppDir)
    inputs.property("oearPrimaryWebAppName", oearPrimaryWebAppName)
    inputs.property("oearMonitorWebAppName", oearMonitorWebAppName)
    outputs.dir(pasoeBuildDir)

    File tempDir = pasoeBuildDir
    into(tempDir)

    doFirst {
        File primaryArchive = file("${oearPrimaryWebAppDir}/${oearPrimaryWebAppName}.zip")
        if (!primaryArchive.exists()) {
            throw new GradleException("Primary webapp archive not found: ${primaryArchive.path}")
        }

        File monitorArchive = file("${oearMonitorWebAppDir}/${oearMonitorWebAppName}.zip")
        if (!monitorArchive.exists()) {
            throw new GradleException("Monitor webapp archive not found: ${monitorArchive.path}")
        }
    }

    // Copy all PASOE resources with a few exceptions by file extension.
    from(pasoeSourceDir) {
        exclude(["**/*.config", "**/*.json", "**/*.map", "**/*.properties"])
    }

    // Copy all application configuration and PASOE tailoring files while replacing custom @TOKEN@ values.
    // Note: This sets the limits for PASOE operation within the deployed ABL Application via the OEAR file.
    from(pasoeSourceDir) {
        include(["**/*.config", "**/*.json", "**/*.map", "**/*.properties"])
        filter { line ->
            line
                .replace("@CLASSPACKAGE@", classPackageName)
                .replace("@CLASSPATH@", classPathPackage)
                .replace("@INSTANCE@", pasoeInstanceName)
                .replace("@PRIMARY_ABLAPP@", oearPrimaryAblAppName)
                .replace("@PRIMARY_WEBAPP@", oearPrimaryWebAppName)
                .replace("@MONITOR_ABLAPP@", oearMonitorAblAppName)
                .replace("@MONITOR_WEBAPP@", oearMonitorWebAppName)
                .replace("@APIVERSION@", apiVersion)
                .replace("@DOMAIN@", pasoeDomainName)
                .replace("@DBNAME@", appDatabaseName)
                .replace("@DBHOST@", configuredDbHost)
                .replace("@DBPORT@", configuredDbPort)
                .replace("@NUM_MSAGENTS_MIN@", numMsAgentsMin)
                .replace("@NUM_MSAGENTS_MAX@", numMsAgentsMax)
                .replace("@NUM_AGENT_CONNS@", numAgentConns)
                .replace("@NUM_ABL_SESSIONS@", numAblSessions)
                .replace("@NUM_INITIAL_SESSIONS@", numInitialSessions)
                .replace("@NUM_MIN_AVAIL_SESSIONS@", numMinAvailSessions)
        }
    }

    // Copy the ABL code as an APL archive for the primary ABL app
    from("$distributionDir/${classPackageName}.apl") {
        into("${oearPrimaryAblAppName}/openedge")
    }

    // Package a copy of the database schema for deployment.
    from(schemaPath) {
        include(["*.df", "*.st"])
        into("${oearPrimaryAblAppName}/tlr/schema")
    }

    // Package a copy of the schema loader for deployment.
    from(schemaOutDir) {
        include(["*.r"])
        into("${oearPrimaryAblAppName}/tlr/schema")
    }
    from("$schemaPath/encrypted") {
        include(["*.p"])
        into("${oearPrimaryAblAppName}/tlr/schema")
    }
}

// Create the ABLApp for the main application's API's as an OEAR bundle
// See: https://docs.progress.com/bundle/pas-for-openedge-management/page/OpenEdge-Application-Archive-Structure.html
// Based on https://github.bedford.progress.com/openedge/teamcity-history/blob/a7648109cd4215a7f453d3e118841c9e37cf84c9/build.gradle
task createPrimaryOEAR {
    inputs.dir(oearPrimaryAblAppBuildDir)

    File resources = oearPrimaryAblAppBuildDir

    doLast() {
        // Defer oeant resolution so unrelated tasks (eg. containerize) do not require this dependency.
        ant.taskdef(
            name: "ABLApp",
            classname: "com.progress.oeant.ABLApp",
            classpath: configurations.OEAntJar.asPath
        )

        // Run last to ensure archive is created after all other setup is completed.
        // NOTE: The webapps folder expects either a .war or .zip file, where a .zip
        // will be extracted atop an oeabl.war and named for the zip file itself.
        // Therefore, the name must represent the final webapp desired and configured.
        ant.ABLApp(
            appName: "${oearPrimaryAblAppName}",
            archiveBaseName: "${oearPrimaryAblAppName}",
            destdir: "${buildDir}/pasoe" ) {
                bin( dir: "$resources/bin" )
                conf( dir: "$resources/conf" )
                openedge( dir: "$resources/openedge" )
                tlr( dir: "$resources/tlr" )
                webapps( dir: "$resources/webapps" )
            }
    }
}

// Create the ABLApp for the main application's API's as an OEAR bundle
// See: https://docs.progress.com/bundle/pas-for-openedge-management/page/OpenEdge-Application-Archive-Structure.html
// Based on https://github.bedford.progress.com/openedge/teamcity-history/blob/a7648109cd4215a7f453d3e118841c9e37cf84c9/build.gradle
task createMonitorOEAR {
    inputs.dir(oearMonitorAblAppBuildDir)

