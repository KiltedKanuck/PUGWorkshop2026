// This task compiles all the source code
task compileCode(type: ABLCompile) {
    dependsOn ResolveOpenEdgeDependencies
    dependsOn createPF
    if (useDatabase) {
        dependsOn ConnectLocalDB
    }

    doNotTrackState("Always compile application code")

    outputs.dir(rcodeOutDir)

    avmOptions {
        parameterFile = file("$resourcesDir/main/build.pf").absolutePath
    }
    compileOptions {
        // we use preprocessed files for doc
        preprocess.enabled = true
        preprocessDir = preprocessOutDir
        debugListDir = listingOutDir
