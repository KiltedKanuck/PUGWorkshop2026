                webapps( dir: "$resources/webapps" )
            }
    }
}

// Copy generated OEAR archives into the distribution folder.
task exportOEAR(type: Copy) {
    dependsOn tailorContents
    dependsOn createPrimaryOEAR, createMonitorOEAR

    mustRunAfter checkDist

    inputs.dir(pasoeBuildDir)

    createPrimaryOEAR.mustRunAfter tailorContents
    createMonitorOEAR.mustRunAfter createPrimaryOEAR

    from(pasoeBuildDir) {
        include("*.oear")
    }
    into(distributionDir)
}

// Create an installer.zip file containing the installer scripts and components for PASOE instance creation.
task createInstaller(type: Zip) {
    dependsOn packageSchema
    dependsOn exportOEAR

    String installSubdir = rootProject.name

    inputs.dir("$mainResourcePath/install")
    inputs.files("$distributionDir/${classPackageName}.apl")

    outputs.file(archiveFile)

    destinationDirectory = distributionDir

    // NOTE: This is named as an unversioned installer file as it will be renamed correctly during the upload to Artifactory.
    archiveBaseName  = "installer"
    archiveExtension = "zip"

    // Include the OEAR created in previous steps.
    from(pasoeBuildDir){
        include(["*.oear", "*.zip"])
        into "${installSubdir}/ablapps"
    }

    // Copy the scripts for the installation process, settting permissions as necessary.
    from("$mainResourcePath/install/bin") {
        include "*"
        exclude "*.out"
        eachFile { fileCopyDetails ->
            if (fileCopyDetails.name.endsWith('.sh')) {
                // Set executable bit only for .sh files
                fileCopyDetails.permissions {
                    unix("rwxr-xr-x")
                }
            }
        }
        into "${installSubdir}/bin"
    }

    // Include all installer configuration files and replace embedded version numbers for this release.
    // NOTE: This provides default values (such as port numbers) direct from the Gradle build.
    from("$mainResourcePath/install/conf"){
        filter { line ->
            line
                .replace("\${pasoeInstanceName}", pasoeInstanceName)
                .replace("\${oearPrimaryAblAppName}", oearPrimaryAblAppName)
                .replace("\${oearPrimaryWebAppName}", oearPrimaryWebAppName)
                .replace("\${oearMonitorAblAppName}", oearMonitorAblAppName)
                .replace("\${oearMonitorWebAppName}", oearMonitorWebAppName)
                .replace("\${pasoeDomainName}", pasoeDomainName)
                .replace("\${pasoeDomainCode}", pasoeDomainCode)
                .replace("\${pasoeRealmUser}", pasoeRealmUser)
                .replace("\${pasoeRealmCode}", pasoeRealmCode)
                .replace("\${pasoeManagerUser}", pasoeManagerUser)
                .replace("\${pasoeManagerCode}", pasoeManagerCode)
                .replace("\${pasoeInstanceHttp}", pasoeInstanceHttp)
                .replace("\${pasoeInstanceHttps}", pasoeInstanceHttps)
                .replace("\${pasoeInstanceAjp}", pasoeInstanceAjp)
                .replace("\${pasoeInstanceShut}", pasoeInstanceShut)
                .replace("\${pasoeInstanceHealth}", pasoeInstanceHealth)
                .replace("\${tomcatExecutorThreads}", tomcatExecutorThreads)
                .replace("\${tomcatMinSpareThreads}", tomcatMinSpareThreads)
                .replace("\${tomcatMaxQueueSize}", tomcatMaxQueueSize)
                .replace("\${tomcatUriEncoding}", tomcatUriEncoding)
                .replace("\${tomcatJvmXmxMb}", tomcatJvmXmxMb)
                .replace("\${tomcatJvmXmsMb}", tomcatJvmXmsMb)
                .replace("\${tomcatJvmNewSizeMb}", tomcatJvmNewSizeMb)
                .replace("\${appDatabaseName}", useDatabase ? appDatabaseName : "none")
                .replace("\${skipDatabaseInstall}", useDatabase ? "false" : "true")
                .replace("\${dbHostName}", configuredDbHost)
                .replace("\${dbPortService}", configuredDbPort)
                .replace("\${dbPortMin}", configuredDbPortMin)
                .replace("\${dbPortMax}", configuredDbPortMax)
                .replace("\${dbLockWait}", configuredDbLockWait)
                .replace("\${dbBiGrow}", configuredDbBiGrow)
                .replace("\${classPackageName}", classPackageName)
                .replace("\${apiVersion}", apiVersion)
        }
        into "${installSubdir}/conf"
    }

    // Include the readme.txt file explicitly.
    from("$mainResourcePath/install/readme.txt") {
        filePermissions {
            unix("rw-rw-r--")
        }
        into "${installSubdir}"
    }

    // Provide a manifest file with build information.
    from(manifestFile){
        expand(packageType: "installer")
        into "${installSubdir}"
    }
}

// Create an archive with the Grafana k6 tests.
task packageK6(type: Zip) {
    // archiveFile is the destDir + archive name. See https://docs.gradle.org/current/dsl/org.gradle.api.tasks.bundling.Zip.html
    outputs.file(archiveFile)

    destinationDirectory = distributionDir

    archiveBaseName   = "k6-tests"
    archiveExtension  = "zip"

    from("src/test/framework/k6") {
        exclude "results*.json"
        eachFile { fileCopyDetails ->
            if (fileCopyDetails.name.endsWith('.sh')) {
                fileCopyDetails.permissions {
                    unix("rwxr-xr-x")
                }
            }
        }
        into "tests"
    }
}

// Create an archive with the Docker deployment scripts.
task packageDocker(type: Zip) {
    // archiveFile is the destDir + archive name. See https://docs.gradle.org/current/dsl/org.gradle.api.tasks.bundling.Zip.html
    outputs.file(archiveFile)

    destinationDirectory = distributionDir

    archiveBaseName  = "docker-support"
    archiveExtension = "zip"

    from("$mainResourcePath/docker")
}

// Extract the installer in a place where it can be tested.
task extractInstaller(type: Copy) {
    dependsOn createInstaller

    File zipFile = createInstaller.archiveFile.get().asFile
    File outputDir = installerDir

    inputs.file(zipFile)
    outputs.dir(outputDir)

    from(zipTree(zipFile))
    into(outputDir)
}

// Full local build: equivalent to the default tasks but preserves build/DLC to avoid re-extraction.
// Use this for local development instead of running gradlew with no arguments.
task local() {
    dependsOn cleanBuildOutput, packageCode, ablTest, packageDebugListings, checkDist, packageK6, packageDocker, extractInstaller

    packageCode.mustRunAfter          cleanBuildOutput
    ablTest.mustRunAfter              packageCode
    packageDebugListings.mustRunAfter ablTest
    checkDist.mustRunAfter            packageDebugListings
    packageK6.mustRunAfter            checkDist
    packageDocker.mustRunAfter        checkDist
    extractInstaller.mustRunAfter     checkDist
}

// Performs the standard tasks to create all distributable components.
// Builds the installer zip while also extracting it to a local directory for easy testing.
defaultTasks "clean", "packageCode", "ablTest", "packageDebugListings", "checkDist", "packageK6", "packageDocker", "extractInstaller"

//*****************************************
//*****    DOCKER CONTAINER TASKS     *****
//*****************************************

// Location for extracted components from our dependencies
File componentsDir = file("$buildDir/components")

// Docker file paths
File dockerfileK6 = file("$projectDir/Dockerfile-k6")

// Define the Docker image names expected to be created/saved.
String dockerGroup = getSafePropValue("docker_group", "pug")
String dockerBaseName = getSafePropValue("docker_basename", "pug")
String dockerAppName = getSafePropValue("docker_appname", "k6")
String dockerImageVersion = "${dockerGroup}/${dockerAppName}:${apiVersion}"
String dockerImageLatest = "${dockerGroup}/${dockerAppName}:latest"

// Docker artifact names
String dockerLatestArchive = "${dockerGroup}-${dockerAppName}-latest.tar"
String dockerLatestArchivePath = "${buildDir}/${dockerLatestArchive}"

// Extract Docker support files (docker-compose, install scripts, README) from Artifactory.
// Note: k6 test scripts are downloaded directly by Dockerfile during image build.
task extractDependencies(type: Copy) {
    doNotTrackState("Always extract contents")

    // Extract Docker support files (deployment/installation scripts for end-users)
    from { configurations.dockerSupport.collect { zipTree(it) } }

    into componentsDir
    dirPermissions {
        unix(0775)
    }
    filePermissions {
        unix(0664)
    }

    includeEmptyDirs = false

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    outputs.dir(componentsDir)
}

// Build the k6 Docker image using the official Grafana k6 base image.
// The Dockerfile downloads pug-<api_version>-k6-tests.zip from Artifactory during image build.
task buildClientImage(type: DockerBuildImage) {
    dependsOn extractDependencies
    dependsOn echoCurrentBranch

    doNotTrackState("Always build new image")

    inputDir = file(projectDir)
    dockerFile = dockerfileK6

    images = [dockerImageVersion, dockerImageLatest]

    noCache = true

    buildArgs = [
        BUILD_VERSION : apiVersion
    ]
}

// Save the OELS Docker image to a local file.
task saveClientImage(type: DockerSaveImage) {
    dependsOn buildClientImage

    doNotTrackState("Always save built image")

    // Create an archive with a specific name for bundling
    images = [dockerImageLatest]
    destFile = file(dockerLatestArchivePath)

    outputs.file(destFile)
}

// Create folders and copy files which must be included in the distributable archive
task postDistProcessing() {
    dependsOn saveClientImage

    doNotTrackState("Always post-process")

    doFirst {
        // Create directories for the extracted Docker files and supporting scripts
        // This ensures the folders exist when the final zip is extracted, as they
        // are used as mount points for the Docker container at runtime.
        mkdir "${componentsDir}/configs"
        mkdir "${componentsDir}/docs"
        mkdir "${componentsDir}/logs"
    }

    // Remove files/folders that don't need to go in the distribution zip
    // (eg. entrypoint.sh is baked into the Docker image during build)
    doLast {
        delete "${componentsDir}/scripts"
    }
}

// Create an OELS image using the configured version.
task packageOELS(type: Zip) {
    dependsOn postDistProcessing

    doNotTrackState("Always zip contents")

    // Produce an artifact with a simple name we can rename later
    archiveBaseName  = "k6client-docker-image"
    archiveExtension = "zip"
    destinationDirectory = distributionDir

    // Include the contents of the components folder
    from(componentsDir) {
        include "**/*"
    }

    // Include the Docker image created previously
    from(buildDir) {
        include dockerLatestArchive
    }

    outputs.file(archiveFile)
}

task containerize {
    dependsOn packageOELS

    doLast {
        logger.lifecycle("Docker containerization complete:")
        logger.lifecycle("  - Base Image: grafana/k6:2.0.0 (official)")
        logger.lifecycle("  - Client Image: ${dockerImageVersion}")
        logger.lifecycle("  - Distribution: ${distributionDir}/k6client-docker-image.zip")
    }
}