// This task creates the rcode procedure library along with the manifest file
task packageRCode(type: PL){
    dependsOn compileCode
    dependsOn compileSchema
    dependsOn CreateManifest

    inputs.dir(rcodeOutDir)
    plFile = "$distributionDir/${classPackageName}.pl"
    outputs.file(plFile)

    codepage = "undefined"
    from(rcodeOutDir.path)

    // The compiler adds r-code for classes that aren't part of this package,
    // so we need to be explicit about what we include in the final archive.
    include("OpenEdge/**",
            "*.r",
            "MANIFEST.OE")

    doFirst {
        // Add any non-ABL files to the folder from which the PL is created
        // Create the MANIFEST for the PL using expanded properties
        copy {
            from manifestFile
            into rcodeOutDir
            expand(packageType: packageType)
        }
    }
}

// Create an APL file (as of OpenEdge 12.7)
task packageProtectedCode(type: APL) {
    dependsOn compileCode

    inputs.dir(rcodeOutDir)
    from(rcodeOutDir)
    archiveBaseName = classPackageName
    destinationDirectory = distributionDir
    outputs.file(archiveFile)

    doFirst {
        // Delete any existing manifest file as this task will create its own.
        delete "${rcodeOutDir}/MANIFEST.OE"
    }

    manifest {
        attributes.put AttributeKeys.ImplementationTitle, "Dev Suite"
        attributes.put AttributeKeys.ImplementationVendor, "Progress Software Corporation"
        attributes.put AttributeKeys.ImplementationVersion, "${oe_build_version}"
        attributes.put AttributeKeys.ComponentName, "${classPackageName}"
        // The Signature-Policy defines whether all libraries in the session should be signed or not.
        // Values: "open" says not all have to be signed while "required" says all have to be signed.
        attributes.put AttributeKeys.SignaturePolicy, SignaturePolicy.OPEN
        // The Validation-Policy defines what the AVM should do if the validation of a signed APL file fails.
        // Values: "none" (do nothing), "warn" (just warn about it), or "fail" (raise an error).
        attributes.put AttributeKeys.ValidationPolicy, ValidationPolicy.WARN
    }
}

// Package the application code as a zip file
task packageAblApp(type: Zip) {
    inputs.dir(rcodeOutDir)
    outputs.file(archiveFile)

    destinationDirectory = distributionDir

    archiveBaseName  = classPackageName
    archiveExtension = "zip"

    from(abl.rcodeDir)
}

// Wrapper task to create rcode pl/apl archives
task packageCode(){
    dependsOn CreateManifest
    dependsOn compileCode
    dependsOn packageRCode
    dependsOn packageAblApp
    dependsOn packageProtectedCode

    // The compile* tasks will create all needed r-code,
    // so we must to make sure that action happens first
    packageRCode.mustRunAfter compileCode

    // Create an archive explicitly for PASOE deployment
    packageAblApp.mustRunAfter packageRCode

    // For OE 12.7 we must package a new .apl archive
    packageProtectedCode.mustRunAfter packageRCode
}

