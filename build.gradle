            classpath: configurations.OEAntJar.asPath
        )

        // Run last to ensure archive is created after all other setup is completed.
        // NOTE: The webapps folder expects either a .war or .zip file, where a .zip
        // will be extracted atop an oeabl.war and named for the zip file itself.
        // Therefore, the name must represent the final webapp desired and configured.
        ant.ABLApp(
            appName: "${oearMonitorAblAppName}",
