// Creates a JSON config file for ABLUnit
def writeTestJsonConfig(Map opts, FileTree testFiles, File cfgFile) {
    if (opts == null) {opts = [:]}

    def generator = new JsonGenerator.Options()
        .excludeNulls()
        .addConverter(File)     { it.path }
        .addConverter(FileTree) { FileTree ft, String key ->
            ArrayList tests = new ArrayList()
            if (key == "tests") {
                ft.getFiles().each {
                    Map testConfig = [test: it]
                    if (opts.get("testCase")) {
                        testConfig.cases = [opts.get("testCase")]
                    }
                    tests.add(testConfig)
                }
            }
            tests
        }
        .build()

    JsonBuilder builder = new JsonBuilder(generator)
    builder{
        options {
                output {
                    location (opts.containsKey("outputLocation") ? opts.get("outputLocation") : testsDir)
                    writers {
                        ablunit {
                            fileName "results"
                        }
                        junit {
                            fileName "junit-results"
                        }
                    }
                }
                quitOnEnd        (opts.containsKey("quitOnEnd") ? opts.get("quitOnEnd") : false)
                showErrorMessage (opts.containsKey("showErrorMessage") ? opts.get("showErrorMessage") : false)
                throwError       (opts.containsKey("throwError") ? opts.get("throwError") : true)
                writeLog         (opts.containsKey("writeLog") ? opts.get("writeLog") : true)
                xref {
                    useXref         true            // always use the prebuilt xrefs
                    xrefLocation    opts.get("xrefLocation")
                    xrefExtension   opts.get("xrefExt")
                    xrefThrowError  opts.get("xrefThrowError")
                }
        }
        tests  testFiles
    }

    cfgFile.text = builder.toPrettyString()
}

