        "${Math.round(tomcatExecutorThreads.toInteger() * 0.1)}" // 10% of Tomcat Executor Threads (rounded to nearest whole number)
    )
)
String tomcatMaxQueueSize = requireNumericPropValue("tomcat_max_queue_size", getSafePropValue("tomcat_max_queue_size", "100"))
String tomcatUriEncoding = getSafePropValue("tomcat_uri_encoding", "UTF-8")
String tomcatJvmXmxMb = requireNumericPropValue("tomcat_jvm_xmx_mb", getSafePropValue("tomcat_jvm_xmx_mb", "2048"))
