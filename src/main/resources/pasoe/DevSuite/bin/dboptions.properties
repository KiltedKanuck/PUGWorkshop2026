# PASOE Database Startup Options
#
# These values are read by both instance_started.sh and instance_started.ps1.
# Keep this file in the bin directory with those scripts for easier local tuning.
#
# Do not set db name/ports/codepage here; those are immutable runtime values from the startup script.
#
# For all options with a parameter:
# - Include the key to enable it.
#
# For switches with no parameter (aistall, bistall, directio):
# - Include the key to enable it.
# - Comment out or remove that key to omit the switch and use OpenEdge default behavior.
#
# For startup background processes (bim, biw, aiw):
# - Include the key to start it.
# - Comment out or remove that key to skip starting it.

# Number of APW processes to start (set 0 for none).
dbopt.apw=4

# Start BI Manager process when present.
dbopt.bim

# Start BI Writer process when present.
dbopt.biw

# Start AI Writer process when present.
dbopt.aiw

# https://docs.progress.com/bundle/openedge-database-management/page/Spin-Lock-Retries-spin.html
dbopt.spin=600000

# https://docs.progress.com/bundle/openedge-database-management/page/LRU-force-skips-lruskips.html
# Utilized only for Enterprise RDBMS
#dbopt.lruskips=20000

# https://docs.progress.com/bundle/openedge-database-management/page/After-image-Buffers-aibufs.html
dbopt.aibufs=200

# https://docs.progress.com/bundle/openedge-database-management/page/Before-image-Buffers-bibufs.html
dbopt.bibufs=200

# https://docs.progress.com/bundle/openedge-database-management/page/Blocks-in-Database-Buffers-B.html
#dbopt.B=16797218
dbopt.B=128000

# https://docs.progress.com/bundle/openedge-database-management/page/Lock-Table-Entries-L.html
dbopt.L=500000

# https://docs.progress.com/bundle/openedge-database-management/page/Message-Buffer-Size-Mm.html
dbopt.Mm=32600

# https://docs.progress.com/bundle/openedge-database-management/page/Maximum-Clients-per-Server-Ma.html
dbopt.Ma=75

# https://docs.progress.com/bundle/openedge-database-management/page/Maximum-Servers-per-Broker-Mpb.html
dbopt.Mpb=30

# https://docs.progress.com/bundle/openedge-database-management/page/Minimum-Clients-per-Server-Mi.html
dbopt.Mi=5

# https://docs.progress.com/bundle/openedge-database-management/page/Maximum-Servers-Mn.html
dbopt.Mn=681

# https://docs.progress.com/bundle/openedge-database-management/page/Number-of-Users-n.html
dbopt.n=8041

# https://docs.progress.com/bundle/openedge-database-management/page/Number-of-Semaphore-Sets-semsets.html
dbopt.semsets=10

# https://docs.progress.com/bundle/openedge-database-management/page/Maximum-Memory-Segment-Mxs.html
dbopt.Mxs=65536

# https://docs.progress.com/bundle/openedge-database-management/page/Hash-Buckets-hash.html
dbopt.hash=2477

# https://docs.progress.com/bundle/openedge-database-management/page/Maximum-Private-Buffer-Pool-Bpmax.html
dbopt.Bpmax=2500

# https://docs.progress.com/bundle/openedge-database-management/page/After-imaging-Archive-Interval-aiarcinterval.html
dbopt.aiarcinterval=300

# https://docs.progress.com/bundle/openedge-database-management/page/Before-image-Threshold-bithold.html
dbopt.bithold=50000

# https://docs.progress.com/bundle/openedge-database-management/page/Maximum-Number-of-Open-Files-Mf.html
dbopt.Mf=200

# https://docs.progress.com/bundle/openedge-database-management/page/After-image-Stall-aistall.html
#dbopt.aistall

# https://docs.progress.com/bundle/openedge-database-management/page/Before-image-Stall-bistall.html
#dbopt.bistall

# https://docs.progress.com/bundle/openedge-database-management/page/Direct-I-O-directio.html
#dbopt.directio
