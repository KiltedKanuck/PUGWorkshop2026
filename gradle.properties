# Plugin Locations and Versions
artifactoryBaseUrl=https://bed-artifactory.bedford.progress.com/artifactory

# /oe-gradle-thirdparty/com/jfrog/artifactory/com.jfrog.artifactory.gradle.plugin/
artifactoryPluginVersion=6.0.0

# /oe-gradle-thirdparty/com/google/osdetector/com.google.osdetector.gradle.plugin/
osdetectorPluginVersion=1.7.3

# /oe-gradle-thirdparty/net/nemerosa/versioning/net.nemerosa.versioning.gradle.plugin/
versioningPluginVersion=3.1.0

# /oe-gradle-thirdparty/com/bmuschko/gradle-docker-plugin/
dockerRemoteApiVersion=9.4.0

# /oe-gradle-thirdparty/com/progress/openedge-version/com.progress.openedge-version.gradle.plugin/
oeVersionPluginVersion=2.0.1

# /oe-gradle-thirdparty/progress/openedge/abl-base/progress.openedge.abl-base.gradle.plugin/
ablBasePluginVersion=2.4.0

# /oe-maven-staging/com/progress/openedge/perl/
perlVersion=5.40.2

# /oe-maven-develop/org/apache/ant/ant-junit/
antJunitVersion=1.10.17

# DLC Home and Compile Tools
DLC=build/DLC
PCT_VERSION=231

# Proactive Fix: Suppress the Gradle welcome (used in 9.5.1 and later)
org.gradle.welcome=never

# Provide compiler options, notably that all field names must be fully qualified.
ablCompilerOpts=req-full-names

# Use a specific OpenEdge version for builds
# Comment out all properties below to use the Git-tagged version/stage
# eg. A tag of BASE_12.8.11_STAGING will use the 12.8.11 from staging
build_stage=develop
#build_stage=staging
#build_stage=release
#build_target_oe_version=12.8.12
build_target_oe_version=13.1.0

# Version number to use for the exposed application APIs and/or packaging of client tests.
# Used to produce artifacts with a known version to keep client and server in agreement.
app_api_version=1.0.0

# Name for the ABL code packages (APL/PL) - DO NOT CHANGE!
package_name=OpenEdge.Workshop

#
# ***** PASOE CONFIGURATION DEFAULTS *****
#
# The following properties allow setting of default values, above and beyond the defaults which may be set
# by the Gradle build script itself. These will affect every build of the PASOE app and installer utility.
#

# Name for the PASOE instance, ideally using a short but descriptive name.
# Note: This will be changed to lowercase even if given a mixed-case value.
pasoe_instance_name=pug

# Name for the primary ABL Application in PASOE (otherwise defaults to "DevSuite").
# Note: This MUST match a folder under the src/main/resources/pasoe as the OEAR's default ABL Application.
oear_primary_ablapp_name=DevSuite

# Name of the primary webapp for the above ABL Application.
# Note: This MUST match a .zip file in the webapps folder.
oear_primary_webapp_name=devsuite

# Name for the monitoring ABL Application in PASOE (otherwise defaults to "DevMonitor").
# Note: This MUST match a folder under the src/main/resources/pasoe as the OEAR's default ABL Application.
oear_monitor_ablapp_name=DevMonitor

# Name of the monitoring webapp for the above ABL Application.
# Note: This MUST match a .zip file in the webapps folder.
oear_monitor_webapp_name=monitor

# Supply known, non-default credentials for the Tomcat container (eg. for management webapps).
pasoe_manager_user=pugadmin
pasoe_manager_code=pug4dm1n

# Provide custom values for the application domain and OERealm token, if needed.
#pasoe_domain_name=pug       # Default: pasoe_instance_name
#pasoe_domain_code=DevSuite  # Default: oear_primary_ablapp_name

# Realm token user and passcode to be generated and used for authentication.
#pasoe_realm_user=RealmClient
#pasoe_realm_code=OEDevSuite

# Default ports for the PASOE instance.
pasoe_instance_http=7780
pasoe_instance_https=7783
pasoe_instance_ajp=7782
pasoe_instance_shut=7784
pasoe_instance_health=7785

# For a full explanation of defaults used within the Gradle build process please see DEFAULTS.md file.

# Control the executor threads for Tomcat based on the expected concurrent user load.
tomcat_executor_threads=1000
# Default the minimum spare threads to ~10% of tomcat_executor_threads
#tomcat_min_spare_threads=500

# Maximum queue size for the HTTP/S connectors.
#tomcat_max_queue_size=100

# Default the URI encoding for Tomcat to UTF-8, but allow for overrides.
#tomcat_uri_encoding=UTF-8

# Adjust the Tomcat JVM options for memory as based on the executor threads and expected load.
# Xmx sized for 5K concurrent user load (5000 threads * 0.5MB * 2.5x GC headroom = ~6,250MB minimum)
tomcat_jvm_xmx_mb=8192
# Xms avoids heap-resize pauses under load. Default: equal to tomcat_jvm_xmx_mb
#tomcat_jvm_xms_mb=4096
# NewSize sized for short-lived request objects. Default: ~20% of tomcat_jvm_xmx_mb
#tomcat_jvm_new_size_mb=768

# Maximum number of MSAgents.
pasoe_num_msagent_max=10

# Minimum/Initial number of MSAgents (greater of 2 or 75% of maximum).
# NOTE: Due to a bug within agentStartLimit for PASOE prior to 12.8.13,
#       the minimum MUST be set equal to the maximum (see: OCTA-96641).
pasoe_num_msagent_min=10

# Maximum connections for each MSAgent.
pasoe_num_agent_conns=50

# Maximum ABL sessions for each MSAgent (default will be equal to pasoe_num_agent_conns).
#pasoe_num_abl_sessions=50

# Initial number of ABL Sessions to start for each MSAgent (default will be ~20% of pasoe_num_agent_conns).
#pasoe_num_initial_sessions=10

# Minimum number of ABL Sessions to keep available based on the current load (Product Default: 1).
# Setting this value too low can cause starvation of ABL Sessions under load, resulting in longer queuing times.
pasoe_min_avail_sessions=3

# Name of the compile/runtime database (otherwise defaults to the rootProject.name value).
# Note: Leave this empty or NONE if no database will be used for the ABL Application.
db_name=thrasher
db_host=127.0.0.1
db_port=11000
db_port_min=11100
db_port_max=11500
db_lockwait=10
db_bi_grow=4
